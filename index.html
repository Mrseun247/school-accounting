<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Accounting System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .tabs { display: flex; border-bottom: 2px solid #ddd; background: #f0f0f0; border-radius: 4px 4px 0 0; }
        .tab { padding: 12px 20px; cursor: pointer; background: #e9ecef; border: none; margin-right: 5px; font-weight: 500; color: #555; border-radius: 4px 4px 0 0; transition: all 0.3s ease; }
        .tab:hover { background: #d9d9d9; color: #333; }
        .tab.active { background: #007bff; color: white; border-bottom: 3px solid #0056b3; }
        .tab-content { display: none; padding: 20px 0; }
        .tab-content.active { display: block; }
        form { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #f9f9f9; }
        .error { color: red; }
        .success { color: green; }
        .fee-checkbox-group { 
            margin-bottom: 12px; 
            padding: 12px; 
            background: #f8f9fa; 
            border-left: 4px solid #007bff; 
            border-radius: 4px;
        }
        .fee-checkbox-group label { 
            margin: 0; 
            display: flex; 
            align-items: center; 
            cursor: pointer;
            font-weight: 500;
            color: #333;
        }
        .fee-checkbox-group input[type="checkbox"] { 
            margin-right: 12px; 
            cursor: pointer;
            width: auto;
            height: 18px;
            width: 18px;
            accent-color: #007bff;
        }
        .fee-checkbox-group .fee-amount {
            margin-left: auto;
            font-weight: bold;
            color: #007bff;
            padding-left: 20px;
        }
        #load-student-fees { 
            padding: 10px 20px; 
            margin-left: 10px; 
            margin-top: -2px;
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-weight: 500;
        }
        #load-student-fees:hover { 
            background: #218838; 
        }
        .student-id-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .student-id-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .student-id-group #load-student-fees {
            margin-left: 0;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>School Accounting System</h1>
        <div class="tabs">
            <button class="tab active" onclick="showTab('register-student')">Register Student</button>
            <button class="tab" onclick="showTab('register-fee')">Register Fee</button>
            <button class="tab" onclick="showTab('record-payment')">Record Payment</button>
            <button class="tab" onclick="showTab('search-student')">Search Student</button>
            <button class="tab" onclick="showTab('generate-report')">Generate Report</button>
        </div>

        <div id="register-student" class="tab-content active">
            <h2>Register Student</h2>
            <form id="student-form">
                <div class="form-group">
                    <label for="student-name">Name</label>
                    <input type="text" id="student-name" required>
                </div>
                <div class="form-group">
                    <label for="student-class">Class</label>
                    <select id="student-class" required>
                        <option value="">-- Select Class --</option>
                        <option value="JSS1">JSS1</option>
                        <option value="JSS2">JSS2</option>
                        <option value="JSS3">JSS3</option>
                        <option value="SSS1">SSS1</option>
                        <option value="SSS2">SSS2</option>
                        <option value="SSS3">SSS3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="student-gender">Gender</label>
                    <select id="student-gender" required>
                        <option value="">-- Select Gender --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="student-parent">Parent/Guardian Name</label>
                    <input type="text" id="student-parent" required>
                </div>
                <button type="submit">Register Student</button>
                <div id="student-message"></div>
            </form>
        </div>

        <div id="register-fee" class="tab-content">
            <h2>Register Fee</h2>
            <form id="fee-form">
                <div class="form-group">
                    <label for="fee-term">Term</label>
                    <input type="text" id="fee-term" placeholder="e.g., Term 1 2024" required>
                </div>
                
                <div class="form-group">
                    <label for="fee-class">Class</label>
                    <select id="fee-class" required>
                        <option value="">-- Select Class --</option>
                        <option value="JSS1">JSS1</option>
                        <option value="JSS2">JSS2</option>
                        <option value="JSS3">JSS3</option>
                        <option value="SSS1">SSS1</option>
                        <option value="SSS2">SSS2</option>
                        <option value="SSS3">SSS3</option>
                    </select>
                </div>
                
                <h3>Fee Breakdown</h3>
                
                <div class="form-group">
                    <label for="fee-tuition">Tuition Fee</label>
                    <input type="number" id="fee-tuition" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-uniform">Uniform</label>
                    <input type="number" id="fee-uniform" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-exam">Exam Fee</label>
                    <input type="number" id="fee-exam" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-club">Club Activity Fee</label>
                    <input type="number" id="fee-club" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-books">Books</label>
                    <input type="number" id="fee-books" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-pta">PTA</label>
                    <input type="number" id="fee-pta" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-ict">ICT</label>
                    <input type="number" id="fee-ict" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-coding">Coding Fee</label>
                    <input type="number" id="fee-coding" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-library">Library</label>
                    <input type="number" id="fee-library" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="fee-lab">Lab Fee</label>
                    <input type="number" id="fee-lab" step="0.01" value="0">
                </div>
                
                <div class="form-group" style="background: #f9f9f9; padding: 10px; border-radius: 4px;">
                    <label><strong>Total Amount:</strong></label>
                    <input type="number" id="fee-total" step="0.01" readonly value="0" style="font-weight: bold; font-size: 1.1em; background: #f0f0f0;">
                </div>
                
                <button type="submit">Register Fee</button>
                <div id="fee-message"></div>
            </form>
        </div>

        <div id="record-payment" class="tab-content">
            <h2>Record Payment</h2>
            <form id="payment-form">
                <div class="student-id-group">
                    <div class="form-group">
                        <label for="payment-student-id">Student ID</label>
                        <input type="text" id="payment-student-id" placeholder="Enter student ID" required>
                    </div>
                    <button type="button" id="load-student-fees">Load Fees</button>
                </div>
                
                <div id="student-info" style="display:none; background: #e8f4f8; padding: 15px; border-radius: 4px; margin-bottom: 20px; border-left: 4px solid #17a2b8;">
                    <p style="margin: 8px 0;"><strong>Student:</strong> <span id="student-name-display" style="color: #007bff;"></span></p>
                    <p style="margin: 8px 0;"><strong>Class:</strong> <span id="student-class-display" style="color: #007bff;"></span></p>
                </div>

                <div id="fees-section" style="display:none;">
                    <h3 style="margin-top: 0; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px;">Select Fees to Pay</h3>
                    <p style="color: #666; margin-bottom: 15px;">Check the fee items you want to pay for:</p>
                    
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="tuition" data-amount="0"> Tuition <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="uniform" data-amount="0"> Uniform <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="exam" data-amount="0"> Exam Fee <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="club" data-amount="0"> Club Activity <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="books" data-amount="0"> Books <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="pta" data-amount="0"> PTA <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="ict" data-amount="0"> ICT <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="coding" data-amount="0"> Coding Fee <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="library" data-amount="0"> Library <span class="fee-amount">0</span></label>
                    </div>
                    <div class="fee-checkbox-group">
                        <label><input type="checkbox" name="fee-item" value="lab" data-amount="0"> Lab Fee <span class="fee-amount">0</span></label>
                    </div>
                    
                    <div class="form-group" style="background: #e7f3ff; padding: 15px; border-radius: 4px; margin-top: 20px; border-left: 4px solid #007bff;">
                        <label style="margin-bottom: 10px;"><strong>Total Amount to Pay:</strong></label>
                        <input type="number" id="payment-amount" step="0.01" readonly value="0" style="font-weight: bold; font-size: 1.2em; background: white; color: #007bff;">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="payment-date">Payment Date</label>
                    <input type="date" id="payment-date" required>
                </div>
                <button type="submit" id="submit-payment" style="display:none;">Record Payment</button>
                <div id="payment-message"></div>
            </form>
        </div>

        <div id="search-student" class="tab-content">
            <h2>Search Student</h2>
            <form id="search-form">
                <div class="form-group">
                    <label for="search-query">Search by Name or ID</label>
                    <input type="text" id="search-query" required>
                </div>
                <button type="submit">Search</button>
            </form>
            <table id="search-results">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="generate-report" class="tab-content">
            <h2>Generate Report</h2>
            <form id="report-form">
                <div class="form-group">
                    <label for="report-term">Term</label>
                    <input type="text" id="report-term" placeholder="e.g., Term 1 2023" required>
                </div>
                <button type="submit">Generate Report</button>
            </form>
            <table id="report-results">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Amount Paid</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwuDhwHzp3qAf95_J43Njghy6s6jY5PuHYygc6OVt8o2ONyzHhp9XavQ18FckRU15TQ/exec';

        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="showTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Helper function for JSONP requests
        function makeJsonpRequest(params, callback) {
            const callbackName = 'jsonpCallback_' + Date.now();
            window[callbackName] = function(data) {
                callback(data);
                delete window[callbackName];
            };
            
            const url = new URL(scriptURL);
            url.searchParams.append('callback', callbackName);
            Object.keys(params).forEach(key => {
                url.searchParams.append(key, params[key]);
            });
            
            const script = document.createElement('script');
            script.src = url.toString();
            script.onerror = function() {
                callback({ success: false, message: 'Request failed' });
                delete window[callbackName];
            };
            document.head.appendChild(script);
        }

        // Register Student
        document.getElementById('student-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('student-name').value;
            const className = document.getElementById('student-class').value;
            const gender = document.getElementById('student-gender').value;
            const parentName = document.getElementById('student-parent').value;
            const message = document.getElementById('student-message');

            makeJsonpRequest({ action: 'addStudent', name, class: className, gender, parentName }, (result) => {
                if (result.success) {
                    message.className = 'success';
                    message.textContent = 'Student registered successfully! ID: ' + result.studentID;
                    e.target.reset();
                } else {
                    message.className = 'error';
                    message.textContent = result.message || 'Error registering student.';
                }
            });
        });

        // Calculate total fee
        function calculateTotal() {
            const tuition = parseFloat(document.getElementById('fee-tuition').value) || 0;
            const uniform = parseFloat(document.getElementById('fee-uniform').value) || 0;
            const exam = parseFloat(document.getElementById('fee-exam').value) || 0;
            const club = parseFloat(document.getElementById('fee-club').value) || 0;
            const books = parseFloat(document.getElementById('fee-books').value) || 0;
            const pta = parseFloat(document.getElementById('fee-pta').value) || 0;
            const ict = parseFloat(document.getElementById('fee-ict').value) || 0;
            const coding = parseFloat(document.getElementById('fee-coding').value) || 0;
            const library = parseFloat(document.getElementById('fee-library').value) || 0;
            const lab = parseFloat(document.getElementById('fee-lab').value) || 0;
            
            const total = tuition + uniform + exam + club + books + pta + ict + coding + library + lab;
            document.getElementById('fee-total').value = total.toFixed(2);
            return total;
        }

        // Add event listeners to all fee inputs
        const feeInputs = ['fee-tuition', 'fee-uniform', 'fee-exam', 'fee-club', 'fee-books', 'fee-pta', 'fee-ict', 'fee-coding', 'fee-library', 'fee-lab'];
        feeInputs.forEach(id => {
            document.getElementById(id).addEventListener('input', calculateTotal);
        });

        // Register Fee
        document.getElementById('fee-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const term = document.getElementById('fee-term').value;
            const feeClass = document.getElementById('fee-class').value;
            const total = calculateTotal();
            
            if (total === 0) {
                document.getElementById('fee-message').className = 'error';
                document.getElementById('fee-message').textContent = 'Please enter at least one fee amount.';
                return;
            }
            
            const feeBreakdown = {
                tuition: parseFloat(document.getElementById('fee-tuition').value) || 0,
                uniform: parseFloat(document.getElementById('fee-uniform').value) || 0,
                exam: parseFloat(document.getElementById('fee-exam').value) || 0,
                club: parseFloat(document.getElementById('fee-club').value) || 0,
                books: parseFloat(document.getElementById('fee-books').value) || 0,
                pta: parseFloat(document.getElementById('fee-pta').value) || 0,
                ict: parseFloat(document.getElementById('fee-ict').value) || 0,
                coding: parseFloat(document.getElementById('fee-coding').value) || 0,
                library: parseFloat(document.getElementById('fee-library').value) || 0,
                lab: parseFloat(document.getElementById('fee-lab').value) || 0
            };
            
            const message = document.getElementById('fee-message');

            makeJsonpRequest({ 
                action: 'addFee', 
                term, 
                class: feeClass,
                amount: total,
                breakdown: JSON.stringify(feeBreakdown)
            }, (result) => {
                if (result.success) {
                    message.className = 'success';
                    message.textContent = 'Fee registered successfully for ' + feeClass + '!';
                    e.target.reset();
                    document.getElementById('fee-total').value = '0';
                } else {
                    message.className = 'error';
                    message.textContent = result.message || 'Error registering fee.';
                }
            });
        });

        // Record Payment
        let currentStudentFees = {};

        // Load student fees when clicking "Load Fees" button
        document.getElementById('load-student-fees').addEventListener('click', (e) => {
            e.preventDefault();
            const studentID = document.getElementById('payment-student-id').value;

            if (!studentID) {
                document.getElementById('payment-message').className = 'error';
                document.getElementById('payment-message').textContent = 'Please enter a Student ID';
                return;
            }

            makeJsonpRequest({ action: 'getStudentFees', studentID }, (result) => {
                const message = document.getElementById('payment-message');
                
                if (result.success && result.student) {
                    // Display student info
                    document.getElementById('student-name-display').textContent = result.student.name;
                    document.getElementById('student-class-display').textContent = result.student.class;
                    document.getElementById('student-info').style.display = 'block';
                    document.getElementById('fees-section').style.display = 'block';
                    document.getElementById('submit-payment').style.display = 'block';

                    // Store current student fees
                    currentStudentFees = result.fees || {};

                    // Update fee amounts in checkboxes
                    const feeItems = document.querySelectorAll('input[name="fee-item"]');
                    feeItems.forEach(item => {
                        const feeType = item.value;
                        const amount = currentStudentFees[feeType] || 0;
                        item.dataset.amount = amount;
                        item.checked = false; // Uncheck all

                        // Update the displayed amount
                        const label = item.closest('.fee-checkbox-group');
                        const amountSpan = label.querySelector('.fee-amount');
                        amountSpan.textContent = amount.toFixed(2);
                    });

                    // Reset total
                    calculatePaymentAmount();
                    message.className = 'success';
                    message.textContent = 'Student fees loaded successfully!';
                } else {
                    message.className = 'error';
                    message.textContent = result.message || 'Student not found or no fees registered.';
                    document.getElementById('student-info').style.display = 'none';
                    document.getElementById('fees-section').style.display = 'none';
                    document.getElementById('submit-payment').style.display = 'none';
                }
            });
        });

        // Calculate payment amount based on selected fees
        function calculatePaymentAmount() {
            let total = 0;
            const feeItems = document.querySelectorAll('input[name="fee-item"]:checked');
            feeItems.forEach(item => {
                total += parseFloat(item.dataset.amount) || 0;
            });
            document.getElementById('payment-amount').value = total.toFixed(2);
        }

        // Add event listeners to fee checkboxes
        document.querySelectorAll('input[name="fee-item"]').forEach(checkbox => {
            checkbox.addEventListener('change', calculatePaymentAmount);
        });

        // Submit payment form
        document.getElementById('payment-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const studentID = document.getElementById('payment-student-id').value;
            const amountPaid = document.getElementById('payment-amount').value;
            const date = document.getElementById('payment-date').value;
            const message = document.getElementById('payment-message');

            if (amountPaid === '0' || amountPaid === '') {
                message.className = 'error';
                message.textContent = 'Please select at least one fee to pay.';
                return;
            }

            // Get selected fee items
            const selectedFees = [];
            document.querySelectorAll('input[name="fee-item"]:checked').forEach(item => {
                selectedFees.push(item.value);
            });

            makeJsonpRequest({ 
                action: 'addPayment', 
                studentID, 
                feeItems: selectedFees.join(','),
                amountPaid,
                date 
            }, (result) => {
                if (result.success) {
                    message.className = 'success';
                    message.textContent = 'Payment recorded successfully!';
                    e.target.reset();
                    document.getElementById('student-info').style.display = 'none';
                    document.getElementById('fees-section').style.display = 'none';
                    document.getElementById('submit-payment').style.display = 'none';
                    document.getElementById('payment-amount').value = '0';
                } else {
                    message.className = 'error';
                    message.textContent = result.message || 'Error recording payment.';
                }
            });
        });

        // Search Student
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const query = document.getElementById('search-query').value;
            const tbody = document.querySelector('#search-results tbody');
            tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

            makeJsonpRequest({ action: 'searchStudent', query }, (result) => {
                tbody.innerHTML = '';
                if (result.success && result.students && result.students.length > 0) {
                    result.students.forEach(student => {
                        const row = `<tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.class}</td>
                            <td>${student.email}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="error">' + (result.message || 'No students found') + '</td></tr>';
                }
            });
        });

        // Generate Report
        document.getElementById('report-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const term = document.getElementById('report-term').value;
            const tbody = document.querySelector('#report-results tbody');
            tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

            makeJsonpRequest({ action: 'getReport', term }, (result) => {
                tbody.innerHTML = '';
                if (result.success && result.payments && result.payments.length > 0) {
                    result.payments.forEach(payment => {
                        const row = `<tr>
                            <td>${payment.studentID}</td>
                            <td>${payment.name}</td>
                            <td>${payment.class}</td>
                            <td>${payment.amountPaid}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="error">' + (result.message || 'No data available') + '</td></tr>';
                }
            });
        });
    </script>
</body>

</html>
